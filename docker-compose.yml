networks:
  rag-net:
    driver: bridge

volumes:
  # Named volume for Hugging Face model weights.
  # On first use, Docker creates it empty and models are downloaded automatically.
  # To pre-populate from your existing host cache, run once:
  #   docker run --rm \
  #     -v hf-cache:/dst \
  #     -v /space/storage/homes/minh/.cache/huggingface:/src:ro \
  #     alpine sh -c "cp -r /src/. /dst/"
  hf-cache:

services:

  # ── One-shot ingestion job ────────────────────────────────────────────────
  # Run manually:  docker compose run --rm ingest
  # Not started by default (profile guard).
  ingest:
    image: nozomu05/llmqwen-ingest:latest
    build:
      context: .
      dockerfile: rag/Dockerfile
    profiles:
      - ingest
    env_file:
      - path: rag/.env
        required: false
    environment:
      - DOCS_DIR=/app/docs
      - CHROMA_DIR=/app/storage/chroma
      - HF_CACHE_DIR=/cache/huggingface
      - HF_HOME=/cache/huggingface
    volumes:
      - ./docs:/app/docs
      - ./storage:/app/storage
      - hf-cache:/cache/huggingface
    restart: "no"
    networks:
      - rag-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  # ── LLM service ──────────────────────────────────────────────────────────
  llm:
    image: nozomu05/llmqwen-llm:latest
    build:
      context: .
      dockerfile: services/llm/Dockerfile
    ports:
      - "8012:8012"
    env_file:
      - path: services/llm/.env
        required: false
    environment:
      - VLLM_BASE_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag-net

  # ── Reranker service ──────────────────────────────────────────────────────
  reranker:
    image: nozomu05/llmqwen-reranker:latest
    build:
      context: .
      dockerfile: services/reranker/Dockerfile
    ports:
      - "8011:8011"
    env_file:
      - path: services/reranker/.env
        required: false
    environment:
      - LLM_SERVICE_URL=http://llm:8012
      - HF_CACHE_DIR=/cache/huggingface
      - HF_HOME=/cache/huggingface
    volumes:
      - hf-cache:/cache/huggingface
    networks:
      - rag-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  # ── Search service ────────────────────────────────────────────────────────
  search:
    image: nozomu05/llmqwen-search:latest
    build:
      context: .
      dockerfile: services/search/Dockerfile
    ports:
      - "8010:8010"
    env_file:
      - path: services/search/.env
        required: false
    environment:
      - RERANKER_SERVICE_URL=http://reranker:8011
      - LLM_SERVICE_URL=http://llm:8012
      - CHROMA_DIR=/app/storage/chroma
      - HF_CACHE_DIR=/cache/huggingface
      - HF_HOME=/cache/huggingface
    volumes:
      - ./storage:/app/storage
      - hf-cache:/cache/huggingface
    networks:
      - rag-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
