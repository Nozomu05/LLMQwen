networks:
  rag-net:
    driver: bridge

services:

  # ── One-shot ingestion job ────────────────────────────────────────────────
  # Run manually:  docker compose run --rm ingest
  # Not started by default (profile guard).
  ingest:
    build:
      context: .
      dockerfile: rag/Dockerfile
    profiles:
      - ingest
    env_file:
      - path: .env
        required: false
    environment:
      - DOCS_DIR=/app/docs
      - CHROMA_DIR=/app/storage/chroma
      - HF_CACHE_DIR=/cache/huggingface
      - HF_HOME=/cache/huggingface
    volumes:
      # docs/ is read+write so the zip extractor can unpack archives in-place
      - ./docs:/app/docs
      # storage/ is shared with the search service — ingest writes, search reads
      - ./storage:/app/storage
      - ${HF_CACHE_DIR:-/tmp/hf-cache}:/cache/huggingface
    restart: "no"
    networks:
      - rag-net

  # ── LLM service ──────────────────────────────────────────────────────────
  llm:
    build:
      context: .
      dockerfile: services/llm/Dockerfile
    ports:
      - "8012:8012"
    env_file:
      - path: .env
        required: false
    environment:
      # vLLM runs on the host — rewrite its URL so the container can reach it
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag-net

  # ── Reranker service ──────────────────────────────────────────────────────
  reranker:
    build:
      context: .
      dockerfile: services/reranker/Dockerfile
    ports:
      - "8011:8011"
    env_file:
      - path: .env
        required: false
    environment:
      # Use Docker service name instead of localhost
      - LLM_SERVICE_URL=http://llm:8012
      - HF_CACHE_DIR=/cache/huggingface
      - HF_HOME=/cache/huggingface
    volumes:
      - ${HF_CACHE_DIR:-/tmp/hf-cache}:/cache/huggingface
    networks:
      - rag-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]   # host GPU 0 = RTX 2080 Ti
              capabilities: [gpu]

  # ── Search service ────────────────────────────────────────────────────────
  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    ports:
      - "8010:8010"
    env_file:
      - path: .env
        required: false
    environment:
      # Use Docker service names instead of localhost
      - RERANKER_SERVICE_URL=http://reranker:8011
      - LLM_SERVICE_URL=http://llm:8012
      # Chroma DB is bind-mounted at /app/storage — same host path as ingest writes to
      - CHROMA_DIR=/app/storage/chroma
      - HF_CACHE_DIR=/cache/huggingface
      - HF_HOME=/cache/huggingface
    volumes:
      # Shared with the ingest service: ingest writes here, search reads here
      - ./storage:/app/storage
      - ${HF_CACHE_DIR:-/tmp/hf-cache}:/cache/huggingface
    networks:
      - rag-net
