<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 class="title">RAG Chatbot</h1>
      <p class="subtitle">Ask questions and review sources in a clean, conversational UI.</p>
      <div id="status" class="status">Ready</div>
      <div id="chat" class="chat"></div>
      <div id="attachments" class="attachments"></div>
      <div class="composer">
        <label class="attach-btn" id="attachLabel" title="Attach documents (max 5)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
          <input type="file" id="fileInput" accept=".pdf,.docx,.pptx,.xlsx,.txt,.csv,.md,.json" multiple style="display:none">
        </label>
        <input id="question" class="input" placeholder="Type your question..." />
        <button id="ask" class="button">Send</button>
      </div>
      <div class="footer">Attach up to 5 documents (PDF, DOCX, PPTX, XLSX, TXT, CSV, MD). Their content will be included in the LLM context.</div>
    </div>
  </div>
    <script src="script.js?v=6"></script>
</body>
</html>
